<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: 아이폰 노치/홈바 영역까지 화면을 채우고, 안전 영역은 CSS env()로 직접 비워 줍니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 모바일 브라우저 상단 주소창 색을 앱 배경색과 맞춥니다. -->
  <meta name="theme-color" content="#111817">
  <meta name="description" content="커플 데이트 코스를 지도에서 함께 고르는 Pop-Pin">
  <!-- 앱 설치 정보(이름·아이콘·색). 안드로이드 앱(TWA)으로 만들 때도 이 파일을 읽습니다. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- 브라우저 탭 아이콘과 아이폰 '홈 화면에 추가' 아이콘 -->
  <link rel="icon" type="image/png" href="/app-icon.png">
  <link rel="apple-touch-icon" href="/app-icon.png">
  <title>Pop-Pin | 데이트 지도</title>
</head>
<body>
  <!-- React가 화면 전체를 그려 넣을 '빈 도화지'입니다. 실제 내용은 src/App.jsx에 있습니다. -->
  <div id="root"></div>
  <!-- 앱의 시작점(entry point). 여기서 React가 #root에 App을 붙입니다. -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
